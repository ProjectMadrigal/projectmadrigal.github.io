# Zet het nieuwe madrigal-script.gs automatisch in Apps Script en publiceert een nieuwe
# versie van de web-app, telkens main verandert. Dan hoef je niets meer te plakken.
#
# Eenmalig nodig (zie README, D1):
#   - geheim CLASPRC_JSON: de inhoud van .clasprc.json na "clasp login" (Google-account van Madrigal)
#   - geheim SCRIPT_ID: de Script-ID uit Apps Script > Projectinstellingen
# Ontbreekt een van beide, dan slaat deze stap zichzelf over.
#
# Het manifest (appsscript.json, met o.a. de service Drive API en de instellingen van de
# web-app) halen we eerst op uit Apps Script, zodat het onveranderd blijft.
name: Apps Script bijwerken
on:
  push:
    branches: [main]
    paths: ['madrigal-script.gs', '.github/workflows/apps-script.yml']
  workflow_dispatch:
concurrency: apps-script
# issues: write, om een melding te openen als Apps Script bijna 200 versies heeft (zie onderaan).
permissions:
  contents: read
  issues: write
jobs:
  bijwerken:
    runs-on: ubuntu-latest
    env:
      CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
      SCRIPT_ID: ${{ secrets.SCRIPT_ID }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instellingen nakijken
        id: klaar
        run: |
          if [ -z "$CLASPRC_JSON" ] || [ -z "$SCRIPT_ID" ]; then
            echo "::notice::CLASPRC_JSON of SCRIPT_ID ontbreekt: Apps Script wordt niet automatisch bijgewerkt. Zie README, D1."
            echo "ok=nee" >> "$GITHUB_OUTPUT"
          else
            echo "ok=ja" >> "$GITHUB_OUTPUT"
          fi

      - name: Tests (enkel bijwerken als alles slaagt)
        if: steps.klaar.outputs.ok == 'ja'
        run: |
          node tests/run.js
          BUNDEL=1 node tests/run.js

      - name: Script naar Apps Script en nieuwe versie publiceren
        if: steps.klaar.outputs.ok == 'ja'
        run: |
          set -euo pipefail
          npm install -g @google/clasp@2.4.2 >/dev/null
          printf '%s' "$CLASPRC_JSON" > "$HOME/.clasprc.json"
          # De web-app die de website gebruikt: het ID staat in de apiUrl van config.js.
          DEPLOYMENT_ID=$(grep -o "script.google.com/macros/s/[A-Za-z0-9_-]\{20,\}/exec" config.js | head -1 | sed "s#.*/s/\(.*\)/exec#\1#")
          if [ -z "$DEPLOYMENT_ID" ]; then echo "::error::Geen apiUrl gevonden in config.js."; exit 1; fi
          mkdir -p gas && cd gas
          printf '{"scriptId":"%s","rootDir":"."}' "$SCRIPT_ID" > .clasp.json
          # Eerst ophalen: zo blijft het manifest (diensten, tijdzone, web-app) zoals het is.
          clasp pull
          test -f appsscript.json
          # Vangnet: is dit wel het script van de catalogus? Anders zou een verkeerde SCRIPT_ID een ander script overschrijven.
          if ! grep -lq "bouwPubliekeCatalogus" ./*.js ./*.gs 2>/dev/null; then
            echo "::error::De SCRIPT_ID hoort niet bij het script van de catalogus. Kijk het geheim SCRIPT_ID na. Er is niets aangepast."
            exit 1
          fi
          # Alle code vervangen door het ene bestand uit deze repository.
          find . -maxdepth 1 -type f \( -name '*.js' -o -name '*.gs' \) -delete
          cp ../madrigal-script.gs ./Code.js
          clasp push --force
          # Apps Script bewaart hoogstens 200 versies. Zitten we aan die grens, dan zeggen we wat je moet doen.
          if ! uit=$(clasp deploy --deploymentId "$DEPLOYMENT_ID" --description "GitHub ${GITHUB_SHA::7}" 2>&1); then
            echo "$uit"
            if echo "$uit" | grep -qi "limit of 200 versions"; then
              echo "::error::Apps Script heeft het maximum van 200 versies bereikt. De code staat al in Apps Script, maar de web-app draait nog op de vorige versie. Open het script, kies links Projectgeschiedenis (het klokje), klik op Versies bulksgewijs verwijderen en verwijder de oudste versies (niet de versie die nu gepubliceerd is). Start daarna deze taak opnieuw: Actions > Apps Script bijwerken > Re-run jobs."
            fi
            exit 1
          fi
          echo "$uit"
          # Vroege waarschuwing: Apps Script bewaart hoogstens 200 versies en het script kan oude versies niet zelf
          # verwijderen (dat kan enkel met de hand). Vanaf 180 komt er een melding (issue) in GitHub, één keer.
          aantal=$(clasp versions 2>/dev/null | sed -n 's/^~ *\([0-9][0-9]*\) Versions* *~.*/\1/p' | head -1 || true)
          echo "Aantal versies in Apps Script: ${aantal:-onbekend}"
          if [ -n "$aantal" ] && [ "$aantal" -ge 180 ]; then
            echo "::warning::Apps Script heeft $aantal van de 200 versies. Ruim oude versies op via Projectgeschiedenis."
            titel="Apps Script: bijna 200 versies, ruim oude versies op"
            if ! gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "\"$titel\" in:title" --json number --jq '.[0].number' | grep -q .; then
              gh issue create --repo "$GITHUB_REPOSITORY" --title "$titel" --body "Apps Script heeft nu $aantal versies. Bij 200 kan de web-app niet meer bijgewerkt worden, en dan krijgt het verkoopscherm of het bestuursscherm de melding Onbekende actie bij nieuwe functies.

          Zo ruim je op:
          1. Open de spreadsheet van de catalogus en kies Extensies > Apps Script.
          2. Klik links op Projectgeschiedenis (het klokje).
          3. Klik op Versies bulksgewijs verwijderen, vink de oudste versies aan (bv. 100) en klik op Verwijderen. De versie die nu gepubliceerd is, staat er niet bij.
          4. Sluit deze melding.

          Het script kan oude versies niet zelf verwijderen: Google laat dat enkel met de hand toe." || echo "::warning::De melding in GitHub kon niet gemaakt worden."
            fi
          fi
          echo "::notice::Apps Script bijgewerkt en nieuwe versie gepubliceerd (${GITHUB_SHA::7}). Voer na een grote wijziging nog Madrigal > Installeer tabbladen uit."

      - name: Opruimen
        if: always()
        run: rm -f "$HOME/.clasprc.json"
