<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Project Madrigal · queer bibliotheek in Antwerpen</title>
  <meta name="description" content="Project Madrigal is een queer bibliotheek in Antwerpen. Leen gratis boeken over gender, seksualiteit en feminisme, en klassiekers uit de gay- en lesbische literatuur.">
  <link rel="canonical" href="https://projectmadrigal.github.io/">
  <!-- Voorbeeldweergave als je een link deelt (WhatsApp, Instagram, Facebook, ...) -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Project Madrigal">
  <meta property="og:locale" content="nl_BE">
  <meta property="og:locale:alternate" content="en_GB">
  <meta property="og:title" content="Project Madrigal, queer bib in Antwerpen">
  <meta property="og:description" content="Project Madrigal is een queer bibliotheek in Antwerpen. Leen gratis boeken over gender, seksualiteit en feminisme, en klassiekers uit de gay- en lesbische literatuur.">
  <meta property="og:url" content="https://projectmadrigal.github.io/">
  <meta property="og:image" content="https://projectmadrigal.github.io/assets/deelbeeld.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="Logo van Project Madrigal met de tekst: queer bib in Antwerpen, leen gratis boeken.">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="theme-color" content="#1b1b1c">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="favicon.ico" sizes="any">
  <link rel="icon" href="assets/logo.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icoon-192.png">
  <link rel="stylesheet" href="styles.css">
  <script>try { var t = localStorage.getItem('madrigal_thema'); if (t) document.documentElement.setAttribute('data-theme', t); } catch (e) {}</script>
</head>
<body data-pagina="home">
  <header id="site-kop"></header>

  <main id="inhoud" class="website" tabindex="-1">
    <section class="sectie sectie-paars hero" aria-labelledby="hero-titel">
      <h1 id="hero-titel" class="hero-tekst">
        <span data-i18n="ikBen">Ik ben</span>
        <span class="hero-woord" id="hero-woord" aria-hidden="true">welkom</span>
        <span class="verborgen" id="hero-alles"></span>
      </h1>
      <form class="hero-zoek" role="search" action="boeken.html" id="hero-zoek">
        <label for="hero-q" class="verborgen" data-i18n="zoekLabel">Zoek een boek</label>
        <input type="search" id="hero-q" name="q" autocomplete="off" data-i18n-placeholder="zoekPlaatshouder">
        <button type="submit" class="knop" data-i18n="zoekKnop">Zoeken</button>
      </form>
    </section>

    <div id="voorbeeld-melding" class="melding let-op" hidden data-i18n="voorbeeldSite"></div>

    <!-- Nieuws en agenda: naast elkaar op een groot scherm, onder elkaar op een gsm. -->
    <div class="sectie sectie-donker">
      <div class="binnen naast-elkaar">
        <section class="kolom" aria-labelledby="nieuws-titel" id="nieuws-sectie">
          <h2 id="nieuws-titel" data-i18n="nieuws">Nieuws</h2>
          <div class="kaarten" id="nieuws"><p class="laden" data-i18n="laden">Even laden...</p></div>
        </section>
        <section class="kolom kolom-geel" aria-labelledby="agenda-titel">
          <h2 id="agenda-titel" data-i18n="agenda">Agenda</h2>
          <div class="kaarten" id="agenda"><p class="laden" data-i18n="laden">Even laden...</p></div>
        </section>
      </div>
    </div>

    <section class="sectie sectie-lila" aria-labelledby="nieuw-titel" id="nieuw-sectie" hidden>
      <div class="binnen">
        <h2 id="nieuw-titel" data-i18n="nieuwBinnen">Nieuw binnen</h2>
        <ul class="aanraders" id="nieuw-binnen"></ul>
        <p class="meer"><a href="boeken.html#/?sorteer=toegevoegd" data-i18n="alleNieuwe">Bekijk alle boeken, laatst toegevoegd eerst</a></p>
      </div>
    </section>

    <section class="sectie sectie-aanraders" aria-labelledby="aanraders-titel" id="aanraders-sectie">
      <div class="binnen">
        <h2 id="aanraders-titel" data-i18n="aanraders">In de kijker</h2>
        <div id="aanraders"></div>
      </div>
    </section>

    <section class="sectie sectie-licht" aria-labelledby="faq-titel" id="faq-sectie">
      <div class="binnen">
        <h2 id="faq-titel" data-i18n="faq">Veelgestelde vragen</h2>
        <div class="faq" id="faq"></div>
      </div>
    </section>

    <section class="sectie sectie-donker" aria-labelledby="langs-titel">
      <div class="binnen contact">
        <div>
          <h2 id="langs-titel" data-i18n="komLangs">Kom eens langs</h2>
          <dl>
            <dt data-i18n="adres">Adres</dt>
            <dd class="tekstblok"><p id="adres"></p></dd>
            <dt data-i18n="openingsuren">Openingsuren</dt>
            <dd class="tekstblok"><p id="openingsuren"></p></dd>
            <dt data-i18n="contact">Contact</dt>
            <dd id="mails"></dd>
          </dl>
          <p><a href="toegankelijkheid.html" data-i18n="toegLink">Hoe geraak je in de bib? Bereikbaarheid en toegankelijkheid</a></p>
        </div>
        <iframe id="kaart" data-i18n-title="kaartTitel" title="Kaart met de locatie van Project Madrigal" loading="lazy"
          src="https://www.openstreetmap.org/export/embed.html?bbox=4.4100%2C51.2054%2C4.4198%2C51.2102&amp;layer=mapnik&amp;marker=51.20780%2C4.41490"></iframe>
      </div>
    </section>
  </main>

  <footer id="site-voet"></footer>

  <script src="config.js"></script>
  <script src="i18n.js?v=6"></script>
  <script src="layout.js?v=2"></script>
  <script src="dom.js"></script>
  <script src="agenda.js"></script>
  <script src="home.js?v=4"></script>
</body>
</html>
